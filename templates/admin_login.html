<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In — Middlesex University Dubai</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/mdx-shield.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>{{ site_theme_css|safe }}</style>
</head>
<body>
    <div class="bg-noscript-fallback"></div>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="nav glass rise-in rise-in--1">
            <div class="nav__brand">
                <img class="nav__mark" src="{{ url_for('static', filename='images/mdx-shield.svg') }}" alt="Middlesex University Dubai crest">
                <div class="nav__brandtext">
                    <strong>Middlesex University Dubai</strong>
                    <em>Staff Digital ID Service</em>
                </div>
            </div>
        </nav>
    </header>

    <div class="admin-auth-shell rise-in rise-in--2">
        <form class="admin-auth-card glass" method="POST">
            <h1>Admin Sign In</h1>
            <p class="panel-sub">Manage Microsoft SSO configuration and Staff Digital IDs.</p>

            {% if error %}
            <div class="form-error">{{ error }}</div>
            {% endif %}

            <div class="field">
                <label for="username">Username</label>
                <div class="field-input-wrap">
                    <input type="text" id="username" name="username" autocomplete="username"
                           value="{{ request.form.get('username', '') }}" required autofocus>
                </div>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="field-input-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary"><span>Sign In</span></button>
            <a class="back-link" href="{{ url_for('portal') }}">← Return to Portal</a>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/background.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script>
        // Enter in the Username field moves to Password instead of
        // submitting early; Enter in Password submits as normal.
        const usernameField = document.getElementById("username");
        const passwordField = document.getElementById("password");
        if (usernameField && passwordField) {
            usernameField.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    passwordField.focus();
                }
            });
        }
    </script>
</body>
</html>
